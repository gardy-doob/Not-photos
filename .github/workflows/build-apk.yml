name: Build APK

on:
  push:
    branches: [jalons, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile l'APK de test
        run: ./gradlew :app:assembleFossDebug --stacktrace
      - name: Publier l'APK
        uses: actions/upload-artifact@v5
        with:
          name: not-photos-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 30
