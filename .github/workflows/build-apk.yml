name: Build APK

on:
  push:
    branches: [jalons, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile l'APK de test
        run: ./gradlew :app:assembleFossDebug --stacktrace
      - name: Publier l'APK
        uses: actions/upload-artifact@v5
        with:
          name: not-photos-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 30

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: not-photos-debug-apk
          path: apk
      - name: Lancer l'app sur un émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke.sh
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captures-emulateur
          path: |
            shots/
            logcat.txt
          retention-days: 7
